<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- Title -->
  <text x="40" y="32" fill="#333" font-size="14" font-weight="600">信頼できない入力が一直線に通る（緑＝各段に差したガード）</text>

  <!-- ===== Stage 1: source ===== -->
  <rect x="40" y="50" width="250" height="62" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="165" y="78" text-anchor="middle" fill="#333" font-size="14" font-weight="600">外部コンテンツ</text>
  <text x="165" y="98" text-anchor="middle" fill="#888" font-size="11">URL / 音声 / 動画（攻撃者の制御下）</text>

  <!-- Guard 1 -->
  <rect x="315" y="48" width="325" height="118" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="330" y="70" fill="#16a34a" font-size="12" font-weight="600">取得・抽出の段</text>
  <text x="330" y="90" fill="#444" font-size="11.5">・SSRF：DNS解決IPの帯域ブロック＋各ホップ再検証</text>
  <text x="330" y="109" fill="#444" font-size="11.5">・8進 / IPv4-mapped IPv6 の正規化（パーサ差分封じ）</text>
  <text x="330" y="128" fill="#444" font-size="11.5">・外部コマンドに `--`（引数インジェクション）</text>
  <text x="330" y="147" fill="#444" font-size="11.5">・zip爆弾は拡張子でなく中身（is_zipfile）で判定</text>

  <!-- arrow -->
  <line x1="165" y1="112" x2="165" y2="186" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Stage 2: claude -p ===== -->
  <rect x="40" y="188" width="250" height="62" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="165" y="216" text-anchor="middle" fill="#333" font-size="14" font-weight="600">claude -p で要約・タグ付け</text>
  <text x="165" y="236" text-anchor="middle" fill="#888" font-size="11">取り込んだ文章をそのまま渡す</text>

  <!-- Guard 2 -->
  <rect x="315" y="186" width="325" height="80" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="330" y="208" fill="#16a34a" font-size="12" font-weight="600">AIに渡す段</text>
  <text x="330" y="228" fill="#444" font-size="11.5">・ツールを一切持たせず実行（探索の手段を断つ）</text>
  <text x="330" y="247" fill="#444" font-size="11.5">・リンク先は既存ノート名だけ注入「発明するな」</text>

  <!-- arrow -->
  <line x1="165" y1="250" x2="165" y2="324" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Stage 3: write_note ===== -->
  <rect x="40" y="326" width="250" height="62" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="165" y="354" text-anchor="middle" fill="#333" font-size="14" font-weight="600">write_note で書き出し</text>
  <text x="165" y="374" text-anchor="middle" fill="#888" font-size="11">AIの出力をファイルへ</text>

  <!-- Guard 3 -->
  <rect x="315" y="324" width="325" height="80" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="330" y="346" fill="#16a34a" font-size="12" font-weight="600">書き込む段</text>
  <text x="330" y="366" fill="#444" font-size="11.5">・symlink宛ての書き込みを拒否</text>
  <text x="330" y="385" fill="#444" font-size="11.5">・パストラバーサル名を拒否 / frontmatter改行除去</text>

  <!-- arrow -->
  <line x1="165" y1="388" x2="165" y2="442" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Output ===== -->
  <rect x="40" y="444" width="250" height="50" rx="6" fill="#fff8e1" stroke="#f0c040"/>
  <text x="165" y="474" text-anchor="middle" fill="#333" font-size="13" font-weight="600">Obsidian ノート</text>

  <!-- threat model footnote -->
  <text x="315" y="468" fill="#888" font-size="11">脅威モデル：自分が選んだコンテンツを取り込む</text>
  <text x="315" y="485" fill="#888" font-size="11">単一ユーザーのローカルツール。残留リスクは受容を明示。</text>
</svg>
