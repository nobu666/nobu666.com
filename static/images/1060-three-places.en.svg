<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system, sans-serif">
  <rect width="680" height="300" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- col1: inside the note -->
  <rect x="24" y="24" width="204" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="126" y="50" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="600">Inside a note</text>
  <text x="126" y="70" text-anchor="middle" fill="#1e40af" font-size="11">Reading one page is enough</text>
  <rect x="40" y="86" width="172" height="48" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text x="126" y="106" text-anchor="middle" fill="#1e3a8a" font-size="12">List of public repos</text>
  <text x="126" y="124" text-anchor="middle" fill="#1e3a8a" font-size="12">disagrees with its own table</text>

  <!-- col2: between notes -->
  <rect x="238" y="24" width="204" height="150" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="340" y="50" text-anchor="middle" fill="#166534" font-size="15" font-weight="600">Between notes</text>
  <text x="340" y="70" text-anchor="middle" fill="#15803d" font-size="11">Cross-check other days' logs</text>
  <rect x="254" y="82" width="172" height="80" rx="6" fill="#fff" stroke="#86efac"/>
  <text x="340" y="100" text-anchor="middle" fill="#166534" font-size="11">Changed version-control path</text>
  <text x="340" y="118" text-anchor="middle" fill="#166534" font-size="11">4 repos missing from a list</text>
  <text x="340" y="136" text-anchor="middle" fill="#166534" font-size="11">Link to a nonexistent note</text>
  <text x="340" y="154" text-anchor="middle" fill="#166534" font-size="11">Switch from symlink to copy</text>

  <!-- col3: note vs reality -->
  <rect x="452" y="24" width="204" height="150" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="554" y="50" text-anchor="middle" fill="#9a3412" font-size="15" font-weight="600">Notes vs. reality</text>
  <text x="554" y="70" text-anchor="middle" fill="#c2410c" font-size="11">Only a machine check finds it</text>
  <rect x="468" y="86" width="172" height="48" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="554" y="106" text-anchor="middle" fill="#9a3412" font-size="12">Deployed copy was missing</text>
  <text x="554" y="124" text-anchor="middle" fill="#9a3412" font-size="12">one safety rule line</text>

  <!-- reach bars -->
  <text x="24" y="200" fill="#555" font-size="12" font-weight="600">Reach</text>
  <rect x="24" y="210" width="204" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="126" y="230" text-anchor="middle" fill="#1e3a8a" font-size="12">rowboat's curator</text>

  <rect x="24" y="250" width="418" height="30" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="233" y="270" text-anchor="middle" fill="#166534" font-size="12">My conventions (copying from vault records OK)</text>

  <rect x="452" y="210" width="204" height="70" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="554" y="231" text-anchor="middle" fill="#9a3412" font-size="12">Not in any rule</text>
  <text x="554" y="250" text-anchor="middle" fill="#9a3412" font-size="12">A human saw the marks</text>
  <text x="554" y="269" text-anchor="middle" fill="#9a3412" font-size="12">and had the machine checked</text>
</svg>
