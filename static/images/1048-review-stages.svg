<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="680" height="620" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <text x="40" y="32" fill="#333" font-size="14" font-weight="600">仕様レビューと実装レビュー（2段階）</text>

  <!-- Stage 1: Fable spec -->
  <rect x="40" y="48" width="250" height="50" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="165" y="78" text-anchor="middle" fill="#333" font-size="13" font-weight="600">Fable 5：仕様執筆</text>

  <rect x="315" y="46" width="325" height="54" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="330" y="68" fill="#16a34a" font-size="11.5" font-weight="600">敵対的レビュー（Subagent）</text>
  <text x="330" y="87" fill="#444" font-size="11">High 3件：SSRFガード欠落／ホスト判定の緩さ／機能退行</text>

  <line x1="165" y1="98" x2="165" y2="152" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Sonnet impl -->
  <rect x="40" y="154" width="250" height="50" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="165" y="184" text-anchor="middle" fill="#333" font-size="13" font-weight="600">Sonnet 5：実装</text>

  <rect x="315" y="152" width="325" height="54" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="330" y="174" fill="#16a34a" font-size="11.5" font-weight="600">敵対的レビュー（Subagent）</text>
  <text x="330" y="193" fill="#444" font-size="11">Low 1件：サブプロセスのタイムアウト未設定</text>

  <line x1="165" y1="204" x2="165" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: real URL verification -->
  <rect x="40" y="260" width="600" height="50" rx="6" fill="#fff8e1" stroke="#f0c040"/>
  <text x="340" y="290" text-anchor="middle" fill="#333" font-size="13" font-weight="600">実URLで動作確認 — ここでレビューにない発見があった</text>

  <!-- divergence section -->
  <text x="40" y="344" fill="#333" font-size="13" font-weight="600">テキストのみのX投稿URLを渡したとき</text>

  <rect x="215" y="358" width="250" height="46" rx="6" fill="#fff" stroke="#999"/>
  <text x="340" y="386" text-anchor="middle" fill="#333" font-size="12">probe：動画サイトと判定</text>

  <line x1="290" y1="404" x2="150" y2="440" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <line x1="390" y1="404" x2="530" y2="440" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- left: designed path (unused) -->
  <rect x="30" y="442" width="240" height="72" rx="6" fill="#f4f4f4" stroke="#ccc"/>
  <text x="150" y="464" text-anchor="middle" fill="#888" font-size="11.5" font-weight="600">設計した経路（想定）</text>
  <text x="150" y="483" text-anchor="middle" fill="#888" font-size="10.5">get_videosが失敗</text>
  <text x="150" y="500" text-anchor="middle" fill="#888" font-size="10.5">→ 専用exitコードで検知</text>

  <!-- right: actual path -->
  <rect x="410" y="442" width="240" height="72" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="530" y="464" text-anchor="middle" fill="#166534" font-size="11.5" font-weight="600">実際に起きたこと（実測）</text>
  <text x="530" y="483" text-anchor="middle" fill="#166534" font-size="10.5">yt-dlp自身が「動画が見つからない」で</text>
  <text x="530" y="500" text-anchor="middle" fill="#166534" font-size="10.5">先に失敗</text>

  <line x1="150" y1="514" x2="300" y2="546" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <line x1="530" y1="514" x2="380" y2="546" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <rect x="215" y="548" width="250" height="46" rx="6" fill="#fff" stroke="#999"/>
  <text x="340" y="576" text-anchor="middle" fill="#333" font-size="12" font-weight="600">convert.py（記事として処理）</text>

  <text x="340" y="612" text-anchor="middle" fill="#888" font-size="10.5">同じ着地点でも、そこに至る経路は設計と実測でずれていた</text>
</svg>
