<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="470" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- Column labels -->
  <text x="230" y="26" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="600">Claude Code（1セッション）</text>
  <text x="540" y="26" text-anchor="middle" fill="#666" font-size="12" font-weight="600">Obsidian Vault（外部記憶）</text>

  <!-- ===== Center column: the loop ===== -->

  <!-- セッション開始 -->
  <rect x="110" y="40" width="240" height="44" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="230" y="67" text-anchor="middle" fill="#333" font-size="14" font-weight="600">セッション開始</text>

  <!-- arrow -->
  <line x1="230" y1="84" x2="230" y2="116" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="104" fill="#888" font-size="11">最初に読む</text>

  <!-- vault 読み取り -->
  <rect x="110" y="118" width="240" height="58" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="230" y="141" text-anchor="middle" fill="#333" font-size="14">vault を読み取り</text>
  <text x="230" y="161" text-anchor="middle" fill="#888" font-size="11">mistakes.md・プロフィール・関連ノート</text>

  <!-- arrow -->
  <line x1="230" y1="176" x2="230" y2="226" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 回答・作業 -->
  <rect x="110" y="228" width="240" height="44" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="230" y="255" text-anchor="middle" fill="#333" font-size="14" font-weight="600">前回の続きから回答・作業</text>

  <!-- arrow purple -->
  <line x1="230" y1="272" x2="230" y2="312" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="238" y="296" fill="#a855f7" font-size="11">その場で記録</text>

  <!-- vault 書き込み -->
  <rect x="110" y="314" width="240" height="58" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="230" y="337" text-anchor="middle" fill="#333" font-size="14">vault に書き込み</text>
  <text x="230" y="357" text-anchor="middle" fill="#888" font-size="11">条件に当てはまったら都度</text>

  <!-- return loop arrow (far left) -->
  <path d="M 110 343 L 70 343 L 70 62 L 110 62" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="64" y="206" text-anchor="middle" fill="#888" font-size="11" transform="rotate(-90 64 206)">次のセッションへ引き継ぐ</text>

  <!-- ===== Right column: Vault folders ===== -->
  <rect x="430" y="118" width="220" height="254" rx="6" fill="#fff" stroke="#bbb"/>

  <rect x="450" y="138" width="180" height="50" rx="5" fill="#f5f5f5" stroke="#ddd"/>
  <text x="462" y="159" fill="#333" font-size="13" font-weight="600">Knowledge/</text>
  <text x="462" y="177" fill="#888" font-size="11">原因と解決策・mistakes.md</text>

  <rect x="450" y="196" width="180" height="38" rx="5" fill="#f5f5f5" stroke="#ddd"/>
  <text x="462" y="213" fill="#333" font-size="13" font-weight="600">Decisions/</text>
  <text x="462" y="228" fill="#888" font-size="11">選んだ判断と理由</text>

  <rect x="450" y="242" width="180" height="38" rx="5" fill="#f5f5f5" stroke="#ddd"/>
  <text x="462" y="259" fill="#333" font-size="13" font-weight="600">Projects/</text>
  <text x="462" y="274" fill="#888" font-size="11">状態・概要の変化</text>

  <rect x="450" y="288" width="180" height="38" rx="5" fill="#f5f5f5" stroke="#ddd"/>
  <text x="462" y="305" fill="#333" font-size="13" font-weight="600">Preferences/</text>
  <text x="462" y="320" fill="#888" font-size="11">好み・作業スタイル</text>

  <text x="540" y="350" text-anchor="middle" fill="#888" font-size="11">すべて Markdown ＋ YAML ＋ [[link]]</text>

  <!-- arrow vault -> read (pull) -->
  <path d="M 430 147 L 390 147" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="139" text-anchor="middle" fill="#888" font-size="10">読む</text>

  <!-- arrow write -> vault (push) -->
  <path d="M 350 343 L 390 343 L 390 200 L 430 200" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="402" y="392" text-anchor="middle" fill="#a855f7" font-size="10">書く</text>

  <!-- git backup note -->
  <line x1="540" y1="372" x2="540" y2="404" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="406" width="220" height="44" rx="6" fill="#fff8e1" stroke="#f0c040"/>
  <text x="540" y="426" text-anchor="middle" fill="#333" font-size="12" font-weight="600">git で30分ごとに自動バックアップ</text>
  <text x="540" y="442" text-anchor="middle" fill="#888" font-size="11">記憶そのものを失わない</text>
</svg>
