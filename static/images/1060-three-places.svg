<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system, sans-serif">
  <rect width="680" height="300" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- col1: inside the note -->
  <rect x="24" y="24" width="204" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="126" y="50" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="600">ノートの中</text>
  <text x="126" y="70" text-anchor="middle" fill="#1e40af" font-size="11">1枚を読めば分かる</text>
  <rect x="40" y="86" width="172" height="48" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text x="126" y="106" text-anchor="middle" fill="#1e3a8a" font-size="12">公開リポジトリの列挙が</text>
  <text x="126" y="124" text-anchor="middle" fill="#1e3a8a" font-size="12">同じノートの表と食い違う</text>

  <!-- col2: between notes -->
  <rect x="238" y="24" width="204" height="150" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="340" y="50" text-anchor="middle" fill="#166534" font-size="15" font-weight="600">ノート同士</text>
  <text x="340" y="70" text-anchor="middle" fill="#15803d" font-size="11">別の日の記録と突き合わせる</text>
  <rect x="254" y="82" width="172" height="80" rx="6" fill="#fff" stroke="#86efac"/>
  <text x="340" y="100" text-anchor="middle" fill="#166534" font-size="12">版管理の経路の変更</text>
  <text x="340" y="118" text-anchor="middle" fill="#166534" font-size="12">一覧から漏れた4リポジトリ</text>
  <text x="340" y="136" text-anchor="middle" fill="#166534" font-size="12">存在しないノートへのリンク</text>
  <text x="340" y="154" text-anchor="middle" fill="#166534" font-size="12">symlink からコピーへの切替</text>

  <!-- col3: note vs reality -->
  <rect x="452" y="24" width="204" height="150" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="554" y="50" text-anchor="middle" fill="#9a3412" font-size="15" font-weight="600">ノートと現実</text>
  <text x="554" y="70" text-anchor="middle" fill="#c2410c" font-size="11">実機で比べないと出てこない</text>
  <rect x="468" y="86" width="172" height="48" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="554" y="106" text-anchor="middle" fill="#9a3412" font-size="12">配置したコピーに</text>
  <text x="554" y="124" text-anchor="middle" fill="#9a3412" font-size="12">安全規則が1行無かった</text>

  <!-- reach bars -->
  <text x="24" y="200" fill="#555" font-size="12" font-weight="600">届く範囲</text>
  <rect x="24" y="210" width="204" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="126" y="230" text-anchor="middle" fill="#1e3a8a" font-size="12">rowboat の整理係</text>

  <rect x="24" y="250" width="418" height="30" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="233" y="270" text-anchor="middle" fill="#166534" font-size="12">うちの規約（Vault の記録から写すのは可）</text>

  <rect x="452" y="210" width="204" height="70" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="554" y="231" text-anchor="middle" fill="#9a3412" font-size="12">規則には無い</text>
  <text x="554" y="250" text-anchor="middle" fill="#9a3412" font-size="12">（要確認）を人が見て</text>
  <text x="554" y="269" text-anchor="middle" fill="#9a3412" font-size="12">実機を確かめさせた</text>
</svg>
