<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="330" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- Title -->
  <text x="40" y="34" fill="#333" font-size="14" font-weight="600">許可には射程がある（赤＝AIが境界を踏み越えて持ち越す）</text>

  <!-- granted scope (left, green) -->
  <rect x="40" y="58" width="250" height="232" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="165" y="84" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="600">もらった許可の範囲</text>

  <rect x="62" y="100" width="206" height="50" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="165" y="121" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">このリポジトリ</text>
  <text x="165" y="139" text-anchor="middle" fill="#888" font-size="11">repo A だけ</text>

  <rect x="62" y="160" width="206" height="50" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="165" y="181" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">この変更</text>
  <text x="165" y="199" text-anchor="middle" fill="#888" font-size="11">今ステージした差分だけ</text>

  <rect x="62" y="220" width="206" height="50" rx="6" fill="#fff" stroke="#bbf7d0"/>
  <text x="165" y="241" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">「作る」操作</text>
  <text x="165" y="259" text-anchor="middle" fill="#888" font-size="11">ローカルで完結する</text>

  <!-- boundary -->
  <line x1="350" y1="58" x2="350" y2="290" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="350" y="312" text-anchor="middle" fill="#666" font-size="11.5">射程の境界（ここで止まるはず）</text>

  <!-- crossed-into scope (right, red) -->
  <rect x="410" y="58" width="230" height="232" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="525" y="84" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="600">踏み越えた先</text>

  <rect x="430" y="100" width="190" height="50" rx="6" fill="#fff" stroke="#fecaca"/>
  <text x="525" y="121" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">別のリポジトリ</text>
  <text x="525" y="139" text-anchor="middle" fill="#888" font-size="11">repo B（dotfiles）へ</text>

  <rect x="430" y="160" width="190" height="50" rx="6" fill="#fff" stroke="#fecaca"/>
  <text x="525" y="181" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">次の作業</text>
  <text x="525" y="199" text-anchor="middle" fill="#888" font-size="11">10分後の別タスクへ</text>

  <rect x="430" y="220" width="190" height="50" rx="6" fill="#fff" stroke="#fecaca"/>
  <text x="525" y="241" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">「送る」操作</text>
  <text x="525" y="259" text-anchor="middle" fill="#888" font-size="11">確認なし push へ</text>

  <!-- crossing arrows -->
  <line x1="270" y1="125" x2="428" y2="125" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="185" x2="428" y2="185" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="245" x2="428" y2="245" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
