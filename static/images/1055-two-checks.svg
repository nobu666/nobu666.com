<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="680" height="450" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- Column labels (top row, clear of arrows) -->
  <text x="170" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#333">NemoClaw: 0.0.0.0:11434</text>
  <text x="510" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#333">うち: 127.0.0.1:11434</text>

  <!-- Attacker page (shared) -->
  <rect x="170" y="52" width="340" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="340" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">攻撃者のWebページ</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#7f1d1d">DNSリバインディングで evil.example → 127.0.0.1</text>

  <!-- Arrows: from attacker box bottom corners straight to each column -->
  <line x1="240" y1="104" x2="170" y2="152" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="440" y1="104" x2="510" y2="152" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Left column: 0.0.0.0 -->
  <rect x="60" y="155" width="220" height="60" rx="8" fill="#fff" stroke="#999" stroke-dasharray="5,4"/>
  <text x="170" y="178" text-anchor="middle" font-size="12" fill="#666">Host 検証</text>
  <text x="170" y="197" text-anchor="middle" font-size="11" fill="#999">ループバック以外 → スキップ</text>
  <line x1="170" y1="215" x2="170" y2="243" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="60" y="245" width="220" height="60" rx="8" fill="#fff" stroke="#999"/>
  <text x="170" y="268" text-anchor="middle" font-size="12" fill="#333">Origin 照合</text>
  <text x="170" y="287" text-anchor="middle" font-size="11" fill="#666">Origin = Host = evil.example → 通過</text>
  <line x1="170" y1="305" x2="170" y2="333" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="60" y="335" width="220" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="170" y="361" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">API に素通し</text>
  <text x="170" y="381" text-anchor="middle" font-size="11" fill="#7f1d1d">/api/create でテンプレート書き換え</text>
  <text x="170" y="396" text-anchor="middle" font-size="11" fill="#7f1d1d">モデル削除・一覧取得</text>

  <!-- Right column: 127.0.0.1 -->
  <rect x="400" y="155" width="220" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Host 検証</text>
  <text x="510" y="197" text-anchor="middle" font-size="11" fill="#166534">evil.example はローカル名でない → 403</text>

  <rect x="400" y="245" width="220" height="60" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="510" y="268" text-anchor="middle" font-size="12" fill="#999">Origin 照合</text>
  <text x="510" y="287" text-anchor="middle" font-size="11" fill="#bbb">（ここまで来ない）</text>

  <rect x="400" y="335" width="220" height="70" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="510" y="365" text-anchor="middle" font-size="12" fill="#999">API</text>
  <text x="510" y="385" text-anchor="middle" font-size="11" fill="#bbb">ブラウザ経路は閉じている</text>

  <!-- Footer note -->
  <text x="340" y="432" text-anchor="middle" font-size="11" fill="#666">同じマシン上のプロセスからは、どちらも認証なしで叩ける</text>
</svg>
