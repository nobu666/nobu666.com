<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, sans-serif">
  <!-- Background -->
  <rect width="680" height="420" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- Title -->
  <text x="40" y="34" fill="#333" font-size="14" font-weight="600">線は「答え合わせを機械に任せられるか」で引かれている</text>

  <!-- Center dividing line -->
  <line x1="340" y1="60" x2="340" y2="340" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Left panel: mechanizable -->
  <text x="180" y="80" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="600">答え合わせを機械に任せられる側</text>

  <rect x="50" y="96" width="260" height="46" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="180" y="115" text-anchor="middle" fill="#333" font-size="11.5">ゲーム環境が次の画面で採点する</text>
  <text x="180" y="132" text-anchor="middle" fill="#888" font-size="10.5">Sol単体13.33% → Sol+Schema 95.35%（自己報告）</text>

  <rect x="50" y="150" width="260" height="46" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="180" y="169" text-anchor="middle" fill="#333" font-size="11.5">テスト189件が通ったかを返す</text>
  <text x="180" y="186" text-anchor="middle" fill="#888" font-size="10.5">記事1048: 実装レビューはLow1件のみ</text>

  <rect x="50" y="204" width="260" height="46" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="180" y="223" text-anchor="middle" fill="#333" font-size="11.5">20ケースの実測マトリクスで白黒</text>
  <text x="180" y="240" text-anchor="middle" fill="#888" font-size="10.5">記事1051: フックの素通り穴2本を検出</text>

  <rect x="50" y="258" width="260" height="46" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="180" y="277" text-anchor="middle" fill="#333" font-size="11.5">grepで数えられる欠陥</text>
  <text x="180" y="294" text-anchor="middle" fill="#888" font-size="10.5">表の孤児行・禁止パターン</text>

  <rect x="50" y="318" width="260" height="34" rx="6" fill="#16a34a"/>
  <text x="180" y="340" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="600">ハーネスの設計で性能を買える</text>

  <!-- Right panel: no oracle -->
  <text x="500" y="80" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="600">答え合わせの相手がいない側</text>

  <rect x="370" y="96" width="260" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="500" y="115" text-anchor="middle" fill="#333" font-size="11.5">主張が結びで回収されているか</text>
  <text x="500" y="132" text-anchor="middle" fill="#888" font-size="10.5">記事1050: 8件中7件は読解でしか拾えず</text>

  <rect x="370" y="150" width="260" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="500" y="169" text-anchor="middle" fill="#333" font-size="11.5">表と本文が食い違っていないか</text>
  <text x="500" y="186" text-anchor="middle" fill="#888" font-size="10.5">要素の有無でなく関係を読む仕事</text>

  <rect x="370" y="204" width="260" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="500" y="223" text-anchor="middle" fill="#333" font-size="11.5">安全弁が正しい場所にあるか</text>
  <text x="500" y="240" text-anchor="middle" fill="#888" font-size="10.5">記事1048: 実URLで動かすまで不明</text>

  <rect x="370" y="258" width="260" height="46" rx="6" fill="#fff" stroke="#ccc" stroke-dasharray="4 3"/>
  <text x="500" y="277" text-anchor="middle" fill="#888" font-size="11.5">「実行したら画面が返ってくる」に</text>
  <text x="500" y="294" text-anchor="middle" fill="#888" font-size="11.5">相当するものが存在しない</text>

  <rect x="370" y="318" width="260" height="34" rx="6" fill="#dc2626"/>
  <text x="500" y="340" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="600">上位モデルの読解に払う</text>

  <!-- Bottom caption -->
  <text x="340" y="392" text-anchor="middle" fill="#94a3b8" font-size="11">同じモデルのまま、線の左側だけが設計で何倍にもなる</text>
</svg>
