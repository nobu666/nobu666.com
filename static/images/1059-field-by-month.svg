<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
  <rect width="680" height="340" fill="#fafafa" rx="8"/>
  <text x="340" y="34" text-anchor="middle" font-size="15" fill="#333">月ごとの応答数: 思考トークンの欄がある／無い</text>

  <!-- legend -->
  <rect x="220" y="50" width="14" height="14" fill="#4a90d9" rx="2"/>
  <text x="240" y="62" font-size="12" fill="#333">欄がある</text>
  <rect x="330" y="50" width="14" height="14" fill="#c8c8c8" rx="2"/>
  <text x="350" y="62" font-size="12" fill="#333">欄が無い</text>

  <!-- baseline -->
  <line x1="60" y1="270" x2="620" y2="270" stroke="#999" stroke-width="1"/>

  <!-- scale: 1500 responses = 180px -> 0.12 px/response -->
  <!-- July: 1434 none -> 172px -->
  <rect x="100" y="98" width="120" height="172" fill="#c8c8c8" rx="3"/>
  <text x="160" y="90" text-anchor="middle" font-size="12" fill="#333">1,434 件 全部無い</text>
  <text x="160" y="292" text-anchor="middle" font-size="13" fill="#333">7月</text>

  <!-- August: 572 has (69px) on bottom, 605 none (73px) on top -->
  <rect x="280" y="201" width="120" height="69" fill="#4a90d9" rx="3"/>
  <rect x="280" y="128" width="120" height="73" fill="#c8c8c8" rx="3"/>
  <text x="340" y="120" text-anchor="middle" font-size="12" fill="#333">1,177 件</text>
  <text x="340" y="169" text-anchor="middle" font-size="12" fill="#333">無い 605</text>
  <text x="340" y="240" text-anchor="middle" font-size="12" fill="#fff">ある 572</text>
  <text x="340" y="292" text-anchor="middle" font-size="13" fill="#333">8月</text>

  <!-- September: 1318 has -> 158px -->
  <rect x="460" y="112" width="120" height="158" fill="#4a90d9" rx="3"/>
  <text x="520" y="105" text-anchor="middle" font-size="12" fill="#333">1,318 件 全部ある</text>
  <text x="520" y="292" text-anchor="middle" font-size="13" fill="#333">9月</text>

  <!-- boundary marker -->
  <line x1="280" y1="201" x2="400" y2="201" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="322" text-anchor="middle" font-size="12" fill="#d9534f">点線が境目。欄が現れたのは 8月16日（Claude Code 2.1.229 から）</text>
</svg>
