<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="680" height="320" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- left: official memory -->
  <text x="40" y="34" fill="#888" font-size="12.5" font-weight="600">公式メモリ機能</text>
  <rect x="40" y="46" width="270" height="230" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="64" y="70" width="222" height="70" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="175" y="98" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">Claude</text>
  <text x="175" y="116" text-anchor="middle" fill="#888" font-size="10.5">その中に記憶が</text>
  <text x="175" y="130" text-anchor="middle" fill="#888" font-size="10.5">閉じたまま</text>
  <text x="76" y="168" fill="#b91c1c" font-size="11">・中身が不透明</text>
  <text x="76" y="190" fill="#b91c1c" font-size="11">・基準がAI任せ</text>
  <text x="76" y="212" fill="#b91c1c" font-size="11">・他AIへ引き継げない</text>
  <text x="76" y="234" fill="#b91c1c" font-size="11">・Claudeが消えると道連れ</text>

  <!-- right: external brain -->
  <text x="370" y="34" fill="#16a34a" font-size="12.5" font-weight="600">外部脳（vault）</text>
  <rect x="370" y="46" width="270" height="230" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="394" y="70" width="222" height="52" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="505" y="92" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">Obsidian vault</text>
  <text x="505" y="109" text-anchor="middle" fill="#888" font-size="10.5">ただのMarkdown・ローカル</text>

  <line x1="470" y1="122" x2="440" y2="152" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrowg)"/>
  <line x1="540" y1="122" x2="570" y2="152" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrowg)"/>

  <rect x="394" y="160" width="100" height="40" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="444" y="184" text-anchor="middle" fill="#333" font-size="11">Claude Code</text>

  <rect x="516" y="160" width="100" height="40" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="566" y="184" text-anchor="middle" fill="#333" font-size="11">別のAI</text>

  <text x="394" y="226" fill="#166534" font-size="11">・中身は全部見える</text>
  <text x="394" y="248" fill="#166534" font-size="11">・基準は自分で決める</text>
  <text x="394" y="270" fill="#166534" font-size="11">・読み手（AI）を差し替えられる</text>

  <text x="340" y="308" text-anchor="middle" fill="#888" font-size="11">Claude専用なのは「読み方のルール」だけ。ルールはテキストなので書き写せる</text>
</svg>
