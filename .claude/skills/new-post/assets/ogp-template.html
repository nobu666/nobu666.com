<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<!--
  OGP テンプレート（1200×630）。案ごとに a.html〜d.html を作り、下記4箇所を差し替える:
    1. slug        … 左上ラベル（例: CLAUDE.local.md / Obsidian Vault / 外部記憶）
    2. chips       … 流れやフォルダを表すチップ列。最後（または主役）の1つに class="green"
                     チップ間の矢印は <span class="arrow">→</span>。等幅にしたいチップは class="mono"
    3. h1          … 大見出し。強調語は <span class="g">...</span> で緑に。改行は <br>
    4. cmd         … 下部のターミナル行。$ は <span class="d">$</span>
  brand（nobu666）は固定。
-->
<div class="ogp">
  <div class="top">
    <div class="slug"><span class="dot"></span>SLUG</div>
    <div class="tags"># TECH&nbsp;&nbsp;# AI</div>
  </div>
  <div class="chips">
    <span class="chip">チップ1</span>
    <span class="arrow">→</span>
    <span class="chip">チップ2</span>
    <span class="arrow">→</span>
    <span class="chip green">主役</span>
  </div>
  <h1>見出し1行目<br>見出し<span class="g">2行目</span></h1>
  <div class="spacer"></div>
  <div class="divider"></div>
  <div class="footrow">
    <span class="cmd"><span class="d">$</span>command here</span>
    <span class="brand">nobu666</span>
  </div>
</div>
</body></html>
