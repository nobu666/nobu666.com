<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="680" height="360" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- ===== ① INDEX ===== -->
  <text x="40" y="36" fill="#16a34a" font-size="12.5" font-weight="600">① 索引：Markdown をチャンク化して埋め込み、sqlite へ</text>

  <rect x="40" y="48" width="104" height="50" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="92" y="70" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">.md vault</text>
  <text x="92" y="87" text-anchor="middle" fill="#888" font-size="10.5">Obsidian</text>

  <line x1="144" y1="73" x2="176" y2="73" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="178" y="48" width="104" height="50" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="230" y="70" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">chunk</text>
  <text x="230" y="87" text-anchor="middle" fill="#888" font-size="10.5">見出し単位</text>

  <line x1="282" y1="73" x2="314" y2="73" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="316" y="48" width="150" height="50" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="391" y="70" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">embed</text>
  <text x="391" y="87" text-anchor="middle" fill="#888" font-size="10.5">Ollama bge-m3（ローカル）</text>

  <line x1="466" y1="73" x2="498" y2="73" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="48" width="140" height="50" rx="6" fill="#fff8e1" stroke="#f0c040"/>
  <text x="570" y="70" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">sqlite</text>
  <text x="570" y="87" text-anchor="middle" fill="#888" font-size="10.5">text ＋ vector</text>

  <!-- sqlite is read by search -->
  <line x1="570" y1="98" x2="570" y2="150" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <text x="562" y="128" text-anchor="end" fill="#16a34a" font-size="10.5">検索はこの索引を走査</text>

  <!-- ===== ② SEARCH ===== -->
  <text x="40" y="150" fill="#16a34a" font-size="12.5" font-weight="600">② 検索（hybrid）</text>

  <rect x="40" y="196" width="104" height="54" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="92" y="219" text-anchor="middle" fill="#333" font-size="12.5" font-weight="600">query</text>
  <text x="92" y="237" text-anchor="middle" fill="#888" font-size="10.5">自然文</text>

  <!-- split to two lanes -->
  <line x1="144" y1="210" x2="226" y2="186" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="144" y1="236" x2="226" y2="262" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="228" y="162" width="216" height="46" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="336" y="183" text-anchor="middle" fill="#333" font-size="12" font-weight="600">意味：cosine（vector）</text>
  <text x="336" y="199" text-anchor="middle" fill="#888" font-size="10.5">言い換えに強い・取りこぼし少</text>

  <rect x="228" y="240" width="216" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="336" y="261" text-anchor="middle" fill="#333" font-size="12" font-weight="600">語：substring（text）</text>
  <text x="336" y="277" text-anchor="middle" fill="#888" font-size="10.5">正確・固有名やコードに強い</text>

  <!-- merge to RRF -->
  <line x1="444" y1="185" x2="496" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="444" y1="263" x2="496" y2="238" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="498" y="196" width="100" height="54" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="548" y="219" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="600">RRF</text>
  <text x="548" y="237" text-anchor="middle" fill="#666" font-size="10.5">順位を融合</text>

  <line x1="598" y1="223" x2="630" y2="223" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="300" text-anchor="middle" fill="#333" font-size="11">→ top-k</text>
  <text x="600" y="316" text-anchor="middle" fill="#888" font-size="10">path:line [emb+kw]</text>
</svg>
