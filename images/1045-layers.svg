<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="680" height="360" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <text x="40" y="30" fill="#888" font-size="11">記憶そのもの</text>

  <!-- layer1: vault -->
  <rect x="40" y="40" width="600" height="70" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="64" y="64" fill="#166534" font-size="12.5" font-weight="600">vault（手動キュレーション）</text>
  <text x="64" y="84" fill="#888" font-size="10.5">Knowledge / Decisions / persona.md / MOC.md — 自分で選んで書いた記憶</text>

  <line x1="340" y1="110" x2="340" y2="130" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>

  <!-- layer2: session search -->
  <rect x="40" y="134" width="600" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="64" y="158" fill="#1d4ed8" font-size="12.5" font-weight="600">セッション全文検索（自動・生ログ）</text>
  <text x="64" y="178" fill="#888" font-size="10.5">キュレーションせず全部残る。vaultに書き忘れた判断も、会話そのものから拾える</text>

  <text x="40" y="222" fill="#888" font-size="11">記憶への経路</text>

  <line x1="340" y1="204" x2="340" y2="232" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowg)"/>

  <!-- layer3: remote control -->
  <rect x="40" y="236" width="600" height="96" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="64" y="260" fill="#854d0e" font-size="12.5" font-weight="600">Remote Control（スマホからのアクセス）</text>
  <text x="64" y="280" fill="#888" font-size="10.5">実行主体はPC側のまま。スマホは操作するウィンドウ</text>
  <text x="64" y="298" fill="#b45309" font-size="10.5">※PCがスリープしていないことが前提</text>

  <rect x="64" y="310" width="120" height="16" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="124" y="322" text-anchor="middle" fill="#333" font-size="9.5">PC: Claude Code</text>
  <line x1="184" y1="318" x2="230" y2="318" stroke="#854d0e" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <rect x="234" y="310" width="120" height="16" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="294" y="322" text-anchor="middle" fill="#333" font-size="9.5">スマホ: 操作</text>
</svg>
