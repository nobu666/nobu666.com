<nav class="u-background">
  <div class="u-wrapper">
    <ul class="Banner">
      <li class="Banner-item Banner-item--title">
        <h1 class="Banner-heading">
          <a class="Banner-link u-clickable" href="{{ relLangURL nil }}">{{ site.Title }}</a>
        </h1>
      </li>
      {{ range site.Menus.main }}
        {{ $url := relLangURL .URL }}
        {{ if isset .Params "format" | and .Page }}
          {{ $url = (.Page.OutputFormats.Get .Params.format).RelPermalink }}
        {{ end }}
        <li class="Banner-item">
          {{ if eq .Name "RSS" }}
            <a class="Banner-link u-clickable" href="{{ $url }}" aria-label="RSS フィード" title="RSS" style="display:inline-flex;align-items:center;box-sizing:border-box;height:3rem;">
              <svg viewBox="0 0 512 512" role="img" aria-label="RSS" style="display:block;width:1.4rem;height:1.4rem;"><rect width="512" height="512" rx="96" fill="#ee802f"/><g transform="translate(96 64) scale(0.72)" fill="#fff"><path d="M0 64C0 46.3 14.3 32 32 32c229.8 0 416 186.2 416 416c0 17.7-14.3 32-32 32s-32-14.3-32-32C384 253.6 226.4 96 32 96C14.3 96 0 81.7 0 64zM0 416a64 64 0 1 1 128 0A64 64 0 1 1 0 416zM0 224c0-17.7 14.3-32 32-32c141.4 0 256 114.6 256 256c0 17.7-14.3 32-32 32s-32-14.3-32-32c0-106-86-192-192-192c-17.7 0-32-14.3-32-32z"/></g></svg>
            </a>
          {{ else }}
            <a class="Banner-link u-clickable" href="{{ $url }}">{{ .Name }}</a>
          {{ end }}
        </li>
      {{ end }}
      <li class="Banner-item" style="display:flex;align-items:center;order:-1;">
        <form role="search" style="margin:0.5rem 1rem;" onsubmit="event.preventDefault();var v=this.q.value.trim();if(v){window.location='https://www.google.com/search?q='+encodeURIComponent('site:nobu666.com '+v);}">
          <input type="search" name="q" placeholder="サイト内検索" aria-label="サイト内検索"
                 style="border:0;border-radius:3px;padding:0.35rem 0.6rem;font-size:1rem;width:9rem;max-width:40vw;background:#fff;color:#000;">
        </form>
      </li>
    </ul>
  </div>
</nav>
