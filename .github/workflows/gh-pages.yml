name: github pages

on:
  push:
    branches:
      - master
  schedule:
    # 予約投稿: 未来日付(date)の記事を、時刻到来後の定期ビルドで公開する。
    # ビルドは --buildFuture を付けないので date が未来の記事は自動で除外され、
    # この cron が記事の時刻を過ぎてから回ったときに初めて公開される。
    # cron は UTC だが、記事の date は +09:00 を含む絶対時刻なので TZ 計算は不要。
    # GitHub の cron は実行が数分〜十数分ずれる/混雑時スキップあり（分単位の精度は出ない）。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Fetch Hugo themes
          fetch-depth: 0         # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.0'
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
