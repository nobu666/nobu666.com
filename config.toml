baseurl = "https://nobu666.com/"
DefaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false
languageCode = "ja"
title = "Real Beat"
theme = "hugo-flex"
uglyurls = true
canonifyURLs = true
copyright = "&copy; nobu666.com"
hasCJKLanguage = true
enableHighlight = true
paginate = 20

[languages]
  [languages.ja]
    languageName = "日本語"
    languageCode = "ja"
    weight = 1
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2

[services]
  [services.disqus]
    shortname = "realbeat"

[Params]
  favicon = "favicon.ico"
  description = "nobu666のテック・日常ブログ。ソフトウェアエンジニアリング、AI、料理、旅行などについて2001年から書いています。"
  subtitle = ""
  commit = false
  divider = "•••" # Divider shown between summaries on the home page
  rss = "このRSSフィードを購読するには、上のURLをコピーして、お使いのRSSリーダーに貼り付けてください。"
  comments = true
  readingTime = true
  wordCount = true
  useHLJS = false
  socialShare = true
  delayDisqus = true
  showRelatedPosts = true
  copyright = "nobu666" # Footer copyright holder, otherwise will use site title
  opengraph = true # Enable OpenGraph if true
  schema = true # Enable Schema
  twitter_cards = true # Enable Twitter Cards if true
  twittercards = true # hugo-flex のテーマが参照するキー（Twitter Cards 有効化）
  readmore = false # Show "Read more" button in list if true
  authorbox = true # Show authorbox at bottom of pages if true
  toc = true # Enable Table of Contents
  pager = true # Show pager navigation (prev/next links) at the bottom of pages if true
  post_meta = ["author", "date", "categories", "translations"] # Order of post meta information
  mainSections = ["2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026" ] # Specify section pages to show on home page and the "Recent articles" widget
  dateformat = "2006-01-02" # Change the format of dates
  mathjax = true # Enable MathJax
  mathjaxPath = "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.6/MathJax.js" # Specify MathJax path
  mathjaxConfig = "TeX-AMS-MML_HTMLorMML" # Specify MathJax config
  googleFontsLink = "https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700" # Load Google Fonts
  customCSS = ["css/custom.css"] # Include custom CSS files
  customJS = ["js/custom.js"] # Include custom JS files
  footer = "<p style=\"font-size:0.85em;color:#888;text-align:center;margin:0;\">当サイトはAmazon.co.jpを宣伝しリンクすることによってサイトが紹介料を獲得できる手段を提供することを目的に設定されたアフィリエイトプログラムである、Amazonアソシエイト・プログラムの参加者です。</p>"

